# ============================================================
#  CONFIG DEL BOT — copia este archivo a config.yaml y edítalo.
#  (config.yaml va en .gitignore: contiene claves de cuentas)
# ============================================================

# --- Cuentas (una por firma/terminal) ---
accounts:
  - name: "Firma1-10k"
    terminal_path: "C:/Program Files/FirmaA MT5/terminal64.exe"
    login: 12345678
    password: "xxxx"
    server: "FirmaA-Server"
    balance_fondeo: 10000     # para tamaño 1% aunque el balance flote
  # - name: "Firma2-25k" ...  (agregar las otras 3)

# --- Riesgo ---
risk:
  pct: 0.01                   # 1% por cuenta
  usar_balance_fondeo: true   # true = 1% del tamaño de fondeo; false = 1% del balance real

# --- Instrumento por temporada ---
# (PENDIENTE confirmar: símbolo por defecto el resto del año)
symbols:
  default: "TBD"             # <-- ¿NAS100 / EURUSD / XAUUSD / US30?
  by_month:
    6:  "US30"   # Junio
    7:  "US30"   # Julio
    11: "US30"   # Noviembre
  # pip_size por símbolo (se usa para el umbral de 8 pips)
  pip_size:
    US30: 1.0                # en índices, 1 pip = 1.0 punto (confirmar con tu broker)
    # EURUSD: 0.0001
    # XAUUSD: 0.1

# --- Horarios (PENDIENTE confirmar huso y qué significa el "/") ---
# Se definen DOS variantes (A/B) que difieren 1h -> asumimos DST.
timezone: "America/New_York"   # <-- confirmar zona de referencia
schedule:
  variant_a:                    # p.ej. invierno
    range_start: "03:00"
    range_end:   "10:30"
    breakout_window_start: "10:30"
    breakout_window_end:   "11:45"
    manual_close: "17:30"
  variant_b:                    # p.ej. verano (+1h)
    range_start: "04:00"
    range_end:   "11:30"
    breakout_window_start: "11:30"
    breakout_window_end:   "12:45"
    manual_close: "18:30"

# --- Reglas de la estrategia ---
strategy:
  timeframe: "M15"
  min_breakout_pips: 8
  sl:
    atr_period: 100
    atr_mult: 1.25
    atr_method: "sma"         # "sma" (tu Pine) o "wilder"
  tp:
    default_rr: 4.0           # TP 1:4
    move_be_at_rr: 3.0        # en 1:3 mover a break-even
    special_months:           # Marzo/Junio/Noviembre -> 1:2.5
      3:  2.5
      6:  2.5
      11: 2.5
  manual_close_overrides:     # límite de cierre manual por mes
    3:  "16:30"
    6:  "16:30"
    11: "17:30"

# --- Filtro de noticias (PENDIENTE: fuente de calendario) ---
news:
  source: "manual"            # "manual" (lista abajo) o "api" (por definir)
  block_fomc: true
  block_powell: true
  allow_if_speaks_after_min: 30   # si habla 30min DESPUÉS de que ya hay trade, ok
  allow_speakers: ["Waller"]      # FOMC members permitidos
  blackout_manual: []             # ["2025-01-29 14:00", ...] si source=manual

# --- Seguridad ---
safety:
  dry_run: true               # true = solo marca señales, NO ejecuta
  max_trades_per_day: 1
  daily_max_loss_pct: 0.03    # kill-switch diario
